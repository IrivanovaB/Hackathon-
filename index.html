<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Issue – skills for charities</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#18343a;--paper:#f2faf8;--card:#fff;--v:#187a9b;--vs:#dcefeb;--sun:#ffda57;--co:#e87962;--ok:#21835e;--mut:#587176;--line:#cfe3df;--blue:#187a9b;--green:#21835e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.05;margin:0 0 .5em}
h1{font-size:clamp(2.6rem,8vw,5.5rem);font-weight:800;letter-spacing:-.03em}
h2{font-size:1.8rem}h3{font-size:1.15rem}
a{color:var(--v)}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:rgba(242,250,248,.94);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font:800 1.4rem 'Bricolage Grotesque';margin-right:auto;cursor:pointer;color:var(--ink)}
.logo-mark{position:relative;display:inline-block;width:38px;height:38px;flex:0 0 38px;border:2px solid var(--ink);border-radius:12px;background:var(--sun);box-shadow:3px 3px 0 var(--ink);transform:rotate(-5deg)}
.logo-mark:before,.logo-mark:after{content:"";position:absolute;height:3px;background:var(--ink);transform-origin:left center;border-radius:3px}
.logo-mark:before{width:15px;left:10px;top:14px;transform:rotate(-28deg)}
.logo-mark:after{width:14px;left:11px;top:17px;transform:rotate(35deg)}
.logo-mark i{position:absolute;width:9px;height:9px;border:2px solid var(--ink);border-radius:50%;background:#fff;z-index:1}
.logo-mark i:nth-child(1){left:4px;top:13px}.logo-mark i:nth-child(2){right:4px;top:5px;background:#bde4eb}.logo-mark i:nth-child(3){right:5px;bottom:4px;background:#bfe9d4}
nav button{background:none;border:0;color:var(--ink);font:600 .95rem Figtree;padding:8px 10px;cursor:pointer;border-radius:8px}
nav button.on,nav button:hover{background:var(--vs)}
button,.btn{font:600 1rem Figtree;cursor:pointer}
.b{background:var(--v);color:#fff;border:2px solid var(--ink);padding:10px 18px;border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.b.alt{background:var(--card);color:var(--ink)}.b.no{background:var(--co);color:#14112b}.b.sm{padding:5px 12px;font-size:.9rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:56px 0 30px;background:radial-gradient(ellipse at 84% 48%,#d7efe4 0,transparent 34%),linear-gradient(120deg,#f2faf8,#eaf5f8);border-radius:0 0 24px 24px}
.hero p{font-size:1.2rem;max-width:34ch;color:var(--mut)}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--green);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero-kicker:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #d7efe4}
.tix{position:relative;height:300px}
.tix:before{content:"";position:absolute;left:35%;top:76px;width:150px;height:150px;border:2px dashed #69a991;border-radius:50%;opacity:.6}
.tk{position:absolute;width:78%;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;box-shadow:5px 5px 0 var(--ink)}
.tk:nth-child(1){top:0;left:0;transform:rotate(-3deg);z-index:1}.tk:nth-child(2){top:95px;left:20%;transform:rotate(2deg);background:#d9f0e5;color:var(--ink);z-index:2}.tk:nth-child(3){top:190px;left:6%;transform:rotate(-1deg);background:#e1f0f5;z-index:1}
.tk b:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--green);vertical-align:1px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0 50px}
.role{text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:3px 4px 0 #c8e2dc;transition:transform .15s}
.role:hover{transform:translate(-2px,-2px);box-shadow:5px 6px 0 #b6dacf}.role strong{font:800 1.5rem 'Bricolage Grotesque';display:block}.role span{color:var(--mut);font-size:.95rem}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.match-shortlist{background:linear-gradient(120deg,#e5f3f6,#eaf6ee);border:1px solid var(--line);border-radius:14px;padding:20px;margin:18px 0 24px}
.match-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.match-heading h3{margin:0 0 4px}.match-heading p{margin:0;color:var(--mut)}
.match-results{display:grid;gap:10px;margin-top:16px}
.match-result{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.match-result-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.match-result h4{margin:0 0 4px;font-size:1rem}
.match-score{flex:0 0 auto;background:#d9f0e5;color:#176344;border-radius:999px;padding:3px 9px;font-size:.8rem;font-weight:800}
.match-result p{margin:8px 0 0;color:var(--mut);font-size:.92rem}
.match-state{margin:14px 0 0;color:var(--mut)}
.match-error{color:#7a1d10}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--vs);padding:2px 10px;border-radius:99px;margin:0 4px 4px 0}
.tag.y{background:var(--sun);color:#14112b}.tag.g{background:#c9f2e0;color:#0b5238}.tag.r{background:#ffd9d3;color:#7a1d10}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:9px 11px}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar>*{flex:1;min-width:140px}
.mut{color:var(--mut);font-size:.92rem}
.err{background:#ffd9d3;color:#7a1d10;padding:10px 14px;border-radius:8px;margin:10px 0;font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:10px;z-index:20;max-width:90vw;display:none}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:92vw}
.item{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.student-profile{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:22px 0 40px;box-shadow:0 8px 24px rgba(24,52,58,.07)}
.profile-cover{height:150px;background:linear-gradient(120deg,#cce8ef,#d5efdf);position:relative;overflow:hidden}
.profile-cover:before{content:"";position:absolute;inset:0;background:linear-gradient(30deg,transparent 48%,rgba(24,122,155,.13) 49%,rgba(24,122,155,.13) 50%,transparent 51%),linear-gradient(150deg,transparent 48%,rgba(33,131,94,.13) 49%,rgba(33,131,94,.13) 50%,transparent 51%);background-size:76px 76px}
.profile-head{position:relative;display:flex;align-items:flex-end;gap:20px;padding:0 28px;margin-top:-58px}
.profile-photo{width:120px;height:120px;flex:0 0 120px;border:5px solid #fff;border-radius:50%;background:#dcefeb;color:var(--green);display:grid;place-items:center;overflow:hidden;font:800 2rem 'Bricolage Grotesque'}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-identity{padding-bottom:8px;min-width:0}
.profile-identity h1{font-size:2rem;line-height:1.1;letter-spacing:0;margin:0 0 5px}
.profile-identity p{margin:0;color:var(--mut)}
.profile-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.profile-badges .tag{margin:0}
.profile-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;padding:26px 28px 28px}
.profile-section{padding:0 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.profile-section:last-child{margin:0;padding:0;border:0}
.profile-section h2{font-size:1.1rem;margin:0 0 10px}
.profile-section p{margin:0;color:var(--mut);white-space:pre-wrap}
.profile-links{display:grid;gap:8px}
.profile-links a,.profile-cv-link{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.profile-links a:hover,.profile-cv-link:hover{text-decoration:underline}
.profile-cv{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#f4faf8}
.profile-cv-icon{display:grid;place-items:center;width:34px;height:40px;flex:0 0 34px;border-radius:6px;background:#dcefeb;color:var(--green);font-size:.72rem;font-weight:800}
.profile-cv p{margin:2px 0 0;color:var(--mut);font-size:.82rem;overflow-wrap:anywhere}
.profile-editor{border-top:1px solid var(--line);padding:18px 28px 24px}
.profile-editor summary{cursor:pointer;font-weight:800;color:var(--blue)}
.profile-editor .row{margin-top:10px}
.profile-editor .b{margin-top:14px}
.profile-editor .mut{margin:8px 0 0}
.profile-input-file{font-size:.88rem}
footer{padding:30px 20px;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}.tix{height:290px}.profile-layout{grid-template-columns:1fr;gap:22px}.profile-cover{height:120px}.profile-head{padding:0 18px;gap:12px}.profile-photo{width:92px;height:92px;flex-basis:92px}.profile-identity h1{font-size:1.6rem}.profile-layout{padding:22px 18px}.profile-editor{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="nav"></div>
<main id="app" class="wrap"></main>
<footer class="mut">Skill Issue · built for the IKU Womxn in STEM Hackathon · demo only, data stays in your browser tab.<br><button class="b sm alt" onclick="demo('admin')" style="margin-top:10px">Platform reviewer demo</button></footer>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _id=100;const nid=()=>++_id;
const SECTORS=['Technology','Legal','Education','Health','Environment','Arts','Finance'];
const TYPES={none:'Direct volunteering',shadow:'Shadowing',mentor:'Mentoring',both:'Shadowing + mentoring'};
const MATCH_API_URL='http://127.0.0.1:8000/api/scan';
const YEARS=['A-level Year 12','A-level Year 13','University Year 1','University Year 2','Beyond second year'];
const FREE=/@(gmail|yahoo|hotmail|outlook|icloud|live|aol|proton(mail)?|me)\./i;
const STU=/(\.ac\.[a-z]{2}|\.edu(\.[a-z]{2})?$|\.sch\.uk|school|college|academy|sixthform)/i;
const dom=e=>e.split('@')[1]||'';
const S={user:null,view:'home',role:null,mode:'up',pend:null,matchState:{loading:false,error:'',results:[]},f:{q:'',sector:'',time:'',loc:''},
users:[
{id:1,role:'student',email:'amara@kcl.ac.uk',pw:'demo',name:'Amara Okafor',loc:'London',year:'University Year 1',values:'Fairness, curiosity',interests:'web design, data, accessibility',projects:'Built a school timetable app',bio:'First-year computing student interested in accessible web design and using technology to make local services easier to find. I enjoy collaborating with community groups and learning from people with different perspectives.',linkedin:'https://www.linkedin.com/',github:'https://github.com/',portfolio:'https://example.com/amara',photo:'https://randomuser.me/api/portraits/women/44.jpg',cv:'amara_cv.pdf',approved:true},
{id:2,role:'company',email:'lead@northline.com',pw:'demo',name:'Priya Shah',companyId:1,approved:true},
{id:3,role:'employee',email:'jo@northline.com',pw:'demo',name:'Jo Bennett',companyId:1,loc:'London',approved:true},
{id:4,role:'charity',email:'hello@greenroots.org.uk',pw:'demo',name:'Green Roots',loc:'Manchester',values:'Community, sustainability',charityNo:'1234567',approved:true},
{id:5,role:'student',email:'zara@ucl.ac.uk',pw:'demo',name:'Zara Ali',loc:'Bristol',year:'University Year 2',values:'Access, empathy',interests:'community research, illustration, education',projects:'Designed a reading tracker for a student society',bio:'Design student who loves turning complex information into friendly, useful experiences. I am keen to contribute creative skills to projects that help young people.',linkedin:'https://www.linkedin.com/',github:'https://github.com/',portfolio:'https://example.com/zara',photo:'https://randomuser.me/api/portraits/women/68.jpg',cv:'zara_ali_cv.pdf',approved:true},
{id:6,role:'student',email:'leo@kcl.ac.uk',pw:'demo',name:'Leo Martins',loc:'London',year:'A-level Year 13',values:'Teamwork, inclusion',interests:'coding, photography, climate action',projects:'Made a recycling guide for my school',bio:'A-level student building confidence in front-end development. I like practical challenges, thoughtful teamwork, and projects that make a visible difference nearby.',linkedin:'https://www.linkedin.com/',github:'https://github.com/',portfolio:'https://example.com/leo',photo:'https://randomuser.me/api/portraits/men/32.jpg',cv:'leo_martins_cv.pdf',approved:true},
{id:7,role:'charity',email:'team@bookbridge.example',pw:'demo',name:'BookBridge Collective',loc:'Bristol',approved:true},
{id:8,role:'charity',email:'hello@neighbourhoodfood.example',pw:'demo',name:'Neighbourhood Food Network',loc:'London',approved:true},
{id:9,role:'charity',email:'youth@brightsteps.example',pw:'demo',name:'Bright Steps Youth',loc:'Manchester',approved:true}],
companies:[{id:1,name:'Northline Capital',loc:'London',sector:'Finance',desc:'Trading and technology firm with a volunteering programme.',domain:'northline.com',verified:true}],
projects:[
{id:1,charityId:4,title:'Volunteer sign-up website',what:'A simple responsive website where locals can sign up for garden days.',why:'Our paper sign-up sheets lose people. A site would double our volunteers.',skills:'HTML, CSS, JavaScript, design',timeline:'6 weeks',deadline:'2026-12-15',budget:'£0 (volunteer led)',type:'mentor',sector:'Technology',loc:'Manchester',hours:25,ask:'Link to any past web project',status:'live',employeeId:null},
{id:2,charityId:4,title:'Leaflet design for open day',what:'Print-ready A5 leaflet.',why:'Reaches households without internet.',skills:'Graphic design',timeline:'2 weeks',deadline:'2026-11-20',budget:'£50 printing',type:'none',sector:'Arts',loc:'Manchester',hours:4,ask:'Portfolio or sketches',status:'live',employeeId:null},
{id:3,charityId:7,title:'Digital reading buddy toolkit',what:'Create a set of simple printable and web-friendly reading activities for volunteer tutors.',why:'Our volunteers need engaging materials they can adapt for different reading levels.',skills:'Education, writing, web design',timeline:'3 weeks',deadline:'2026-11-30',budget:'Volunteer led',type:'none',sector:'Education',loc:'Bristol',hours:12,ask:'A short note about your relevant skills',status:'live',employeeId:null},
{id:4,charityId:8,title:'Map local food support',what:'Build a clear mobile-friendly directory of community fridges and food support sessions.',why:'Residents often do not know which nearby services are open or how to access them.',skills:'Research, data, web design',timeline:'4 weeks',deadline:'2026-12-08',budget:'Volunteer led',type:'none',sector:'Technology',loc:'London',hours:18,ask:'A link to a project or example',status:'live',employeeId:null},
{id:5,charityId:9,title:'Youth club social media starter kit',what:'Create an accessible set of post templates and a short content plan for our winter programme.',why:'We want more local young people to hear about free creative workshops.',skills:'Graphic design, writing, social media',timeline:'2 weeks',deadline:'2026-11-26',budget:'Volunteer led',type:'none',sector:'Arts',loc:'Manchester',hours:8,ask:'A sample design or writing piece',status:'live',employeeId:null},
{id:6,charityId:7,title:'Website accessibility review',what:'Review the main pages of our site and suggest practical improvements for keyboard and screen-reader users.',why:'We want our resources to work for more students and families.',skills:'Accessibility, testing, writing',timeline:'2 weeks',deadline:'2026-12-12',budget:'Volunteer led',type:'none',sector:'Technology',loc:'Bristol',hours:10,ask:'Tell us about any accessibility experience',status:'live',employeeId:null}],
apps:[
{id:201,projectId:2,userId:1,msg:'I can create a clear, accessible leaflet and test it with students.',extra:'Design samples',cv:'amara_cv.pdf',status:'sent'},
{id:202,projectId:4,userId:5,msg:'I would love to help make local food support easier to find.',extra:'Reading tracker project',cv:'zara_ali_cv.pdf',status:'accepted'},
{id:203,projectId:6,userId:6,msg:'I can test keyboard navigation and write up clear recommendations.',extra:'School recycling guide',cv:'leo_martins_cv.pdf',status:'sent'}]};
const me=()=>S.user, co=u=>S.companies.find(c=>c.id===u.companyId), ch=id=>S.users.find(u=>u.id===id), pr=id=>S.projects.find(p=>p.id===id);
function toast(m,ms=4500){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}
function go(v){S.view=v;render();scrollTo(0,0)}
function render(){
 const u=me(),tabs=!u?[]:{student:[['browse','Opportunities'],['mine','My applications'],['profile','Profile']],
 employee:[['browse','Open projects'],['mine','My offers'],['decide','Student applications'],['profile','Profile']],
 company:[['profile','Company'],['team','Employees']],
 charity:[['mine','My projects'],['post','Submit project'],['decide','Offers received']],
 admin:[['admin','Review queue']]}[u.role];
 $('nav').innerHTML=`<nav><span class="logo" onclick="go('home')"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>Skill Issue</span>`+tabs.map(t=>`<button class="${S.view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+(u?`<button onclick="S.user=null;go('home')">Log out (${esc(u.name)})</button>`:`<button onclick="go('home')">Home</button>`)+`</nav>`;
 const V={home,auth,verify,browse,mine,profile,post,decide,team,admin};
 $('app').innerHTML=(u&&S.view==='home'?dash():V[S.view]())
}
function home(){return `<section class="hero"><div><span class="hero-kicker">Skills shared, impact multiplied</span><h1>Got a skill issue?</h1><p>Charities, students, and companies bring their skills together to turn good ideas into real community impact.</p></div>
<div class="tix" aria-label="Examples of people collaborating"><div class="tk"><b>Food bank + web volunteer</b><div class="mut">Building a sign-up site together · 6 weeks</div></div><div class="tk"><b>Student + legal mentor</b><div>Learning together at a tenancy clinic</div></div><div class="tk"><b>Community + interpreters</b><div class="mut">Making a welcome evening accessible</div></div></div></section>
<h2>Who would you like to connect?</h2><div class="roles">${[['student','Student','Team up with charities and learn from experienced mentors.'],['company','Company','Share company skills through mentoring and collaboration.'],['charity','Charity','Find skilled partners to bring your next project to life.']].map(r=>`<button class="role" onclick="S.role='${r[0]}';S.mode='up';go('auth')"><strong>${r[1]}</strong><span>${r[2]}</span></button>`).join('')}</div>
<div class="panel"><h3>Student demo accounts</h3><p class="mut">Choose a student to explore their profile, applications, and opportunities.</p>${S.users.filter(u=>u.role==='student').map(u=>`<button class="b sm alt" onclick="demo('student',${u.id})">${esc(u.name)}</button> `).join('')}<p class="mut">Other views: ${[['company','Company'],['charity','Charity']].map(([r,label])=>`<button class="b sm alt" onclick="demo('${r}')">${label}</button> `).join('')}</p></div>`}
function demo(r,id){S.user=id?S.users.find(u=>u.id===id):r==='admin'?{id:0,role:'admin',name:'Reviewer'}:S.users.find(u=>u.role===r);S.matchState={loading:false,error:'',results:[],checked:false};go(r==='admin'?'admin':'home')}
function dash(){const u=me();if(u.role==='student')return browse();if(u.role==='employee')return browse();if(u.role==='company')return profile();if(u.role==='charity')return mine();return admin()}
function auth(){const r=S.role||'student',up=S.mode==='up',cos=S.companies.filter(c=>c.verified);
 return `<div class="panel" style="max-width:600px;margin:30px auto"><h2>${up?'Create':'Log in to'} your ${r} account</h2>
 <p class="mut">${up?'Use your own '+({student:'school or university',charity:'charity',company:'company'}[r])+' email. Free email addresses are not accepted.':''}</p><div id="err"></div>
 ${up?`<label for="n">${r==='charity'?'Charity name':'Full name'}</label><input id="n">`:''}
 <label for="e">Email</label><input id="e" type="email"><label for="p">Password</label><input id="p" type="password">
 ${up&&r==='student'?`<label for="y">Current study stage</label><select id="y">${YEARS.map(y=>`<option>${y}</option>`).join('')}</select>`:''}
 ${up&&r==='charity'?`<label for="cn">Charity Commission registration number</label><input id="cn" inputmode="numeric" placeholder="e.g. 1234567"><label for="l">Location</label><input id="l"><label for="v">Values</label><textarea id="v"></textarea>`:''}
 ${up&&r==='company'?`<label for="k">I am</label><select id="k" onchange="$('nc').style.display=this.value==='new'?'block':'none';$('ex').style.display=this.value==='new'?'none':'block'"><option value="new">Registering a new company</option><option value="emp">An employee of a registered company</option></select>
 <div id="ex" style="display:none"><label for="cc">Company</label><select id="cc">${cos.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div id="nc"><label for="cn2">Company name</label><input id="cn2"><label for="cl">Location</label><input id="cl"><label for="cs">Sector</label><select id="cs">${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select><label for="cd">Description</label><textarea id="cd"></textarea></div>`:''}
 <p><button class="b" onclick="${up?'signup()':'login()'}">${up?'Create account':'Log in'}</button> <button class="b alt" onclick="S.mode='${up?'in':'up'}';render()">${up?'I have an account':'Create account'}</button></p></div>`}
const err=m=>$('err').innerHTML=`<div class="err" role="alert">${m}</div>`;
function login(){const u=S.users.find(x=>x.email===$('e').value.trim().toLowerCase()&&x.pw===$('p').value);
 if(!u)return err('Email or password not recognised.');if(u.role!==S.role)return err(`This email is registered as a ${u.role}. Pick that role on the home page.`);
 if(!u.approved)return err('Your account is still waiting for verification.');S.user=u;go('home')}
function signup(){const r=S.role,e=$('e').value.trim().toLowerCase(),n=($('n')||{}).value?.trim(),p=$('p').value;
 if(!/^\S+@\S+\.\S+$/.test(e))return err('Enter a valid email address.');if(!p||p.length<4)return err('Password needs at least 4 characters.');
 if(S.users.some(u=>u.email===e))return err('That email is already registered.');
 if(FREE.test(e))return err('Free email providers are not accepted. Use your organisation email.');
 const d={id:nid(),role:r,email:e,pw:p,name:n,approved:false};
 if(!n)return err('Name is required.');
 if(r==='student'){if(!STU.test(e))return err('Student emails must be a school, college or university address (for example .ac.uk).');
  const y=$('y').value;if(y==='Beyond second year')return err('Skill Issue is for A-level students up to second-year university students.');d.year=y}
 if(r==='charity'){const c=$('cn').value.trim();if(!/^\d{6,8}$/.test(c))return err('Enter a valid 6 to 8 digit Charity Commission registration number.');
  Object.assign(d,{charityNo:c,loc:$('l').value,values:$('v').value})}
 if(r==='company'){if($('k').value==='new'){const nm=$('cn2').value.trim();if(!nm)return err('Company name is required.');
  const c={id:nid(),name:nm,loc:$('cl').value,sector:$('cs').value,desc:$('cd').value,domain:dom(e),verified:false};S.companies.push(c);d.companyId=c.id}
  else{const c=S.companies.find(c=>c.id==$('cc').value);if(!c)return err('No verified company to join yet.');if(dom(e)!==c.domain)return err('Your email must end @'+c.domain+' to join '+c.name+'.');d.role='employee';d.companyId=c.id}}
 d.code=String(Math.floor(100000+Math.random()*900000));S.pend=d;go('verify');toast('Demo inbox: your verification code is '+d.code,15000)}
function verify(){return `<div class="panel" style="max-width:520px;margin:30px auto"><h2>Check your email</h2><p>We sent a 6-digit code to <b>${esc(S.pend.email)}</b>.</p><div id="err"></div><label for="c">Code</label><input id="c" inputmode="numeric" maxlength="6"><p><button class="b" onclick="confirmCode()">Verify email</button></p></div>`}
function confirmCode(){const d=S.pend;if($('c').value!==d.code)return err('That code is not right. Try again.');
 S.users.push(d);S.pend=null;const msg={student:'Verified! You can log in now.',charity:'Email verified. The platform team will now check your Charity Commission number.',company:'Email verified. The platform team will now verify your company.',employee:'Email verified. Your company lead must approve you, then the platform verifies you.'}[d.role];
 if(d.role==='student')d.approved=true;S.role=d.role==='employee'?'company':d.role;S.mode='in';go('auth');toast(msg,7000)}
function profile(){const u=me(),c=u.companyId&&co(u);
 if(u.role==='company'||u.role==='employee')return `<h2>${u.role==='company'?'Company profile':'Your profile'}</h2><div class="panel"><h3>${esc(c.name)} ${c.verified?'<span class="tag g">Verified</span>':'<span class="tag y">Awaiting verification</span>'}</h3><p>${esc(c.desc)}</p><p class="mut">${esc(c.loc)} · ${esc(c.sector)}</p></div>
 ${u.role==='employee'?`<div class="panel"><h3>${esc(u.name)}</h3><label for="pl">Location</label><input id="pl" value="${esc(u.loc)}"><p class="mut">Employer: ${esc(c.name)}</p><button class="b" onclick="me().loc=$('pl').value;toast('Profile saved')">Save profile</button></div>`:''}`
 if(u.role==='student'){
    const initials=(u.name||'Student').trim().split(/\s+/).slice(0,2).map(part=>part[0]).join('').toUpperCase();
    const imageSource=profileImageSource(u.photo);
    const photo=imageSource?`<img src="${esc(imageSource)}" alt="${esc(u.name)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>${esc(initials)}</span>`:esc(initials);
    const interests=(u.interests||'').split(',').map(x=>x.trim()).filter(Boolean);
    const links=[profileLink('LinkedIn',u.linkedin),profileLink('GitHub',u.github),profileLink('Portfolio',u.portfolio)].filter(Boolean);
    const cv=u.cv?`<div class="profile-cv"><span class="profile-cv-icon">CV</span><div><b>${esc(u.cv)}</b><p>${u.cvData?'Attached for this demo session':'Sample CV attached'}</p>${u.cvData?`<a class="profile-cv-link" href="${esc(u.cvData)}" download="${esc(u.cv)}">Download CV</a>`:''}</div></div>`:'<p class="mut">No CV attached yet.</p>';
    return `<h2 class="sr-only">Your profile</h2><article class="student-profile">
        <div class="profile-cover" aria-hidden="true"></div>
        <header class="profile-head"><div class="profile-photo">${photo}</div><div class="profile-identity"><h1>${esc(u.name)}</h1><p>${esc(u.headline||u.year||'Student volunteer')}</p><p>${esc(u.loc||'Location not added')}</p><div class="profile-badges"><span class="tag">${esc(u.year||'Student')}</span><span class="tag g">Open to volunteering</span></div></div></header>
        <div class="profile-layout"><main>
            <section class="profile-section"><h2>About</h2><p>${esc(u.bio||'Add a short introduction about your interests, strengths, and the causes you care about.')}</p></section>
            <section class="profile-section"><h2>Interests and skills</h2><div>${interests.length?interests.map(x=>`<span class="tag">${esc(x)}</span>`).join(''):'<span class="mut">Add interests and skills to help charities find a good match.</span>'}</div></section>
            <section class="profile-section"><h2>Experience and projects</h2><p>${esc(u.projects||'Add a project, activity, or experience you are proud of.')}</p></section>
            <section class="profile-section"><h2>Values</h2><p>${esc(u.values||'Add the causes and values that matter to you.')}</p></section>
        </main><aside>
            <section class="profile-section"><h2>Links</h2><div class="profile-links">${links.join('')||'<span class="mut">Add your professional links.</span>'}</div></section>
            <section class="profile-section"><h2>CV</h2>${cv}</section>
        </aside></div>
        <details class="profile-editor"><summary>Edit profile</summary>
            <div class="row"><div><label for="pn">Name</label><input id="pn" value="${esc(u.name||'')}"></div><div><label for="ph">Headline</label><input id="ph" value="${esc(u.headline||'')}" placeholder="e.g. Computing student interested in accessible design"></div>
            <div><label for="pl">Location</label><input id="pl" value="${esc(u.loc||'')}"></div><div><label for="photo">Profile photo</label><input class="profile-input-file" id="photo" type="file" accept="image/jpeg,image/png,image/webp"></div></div>
            <label for="pbio">Bio</label><textarea id="pbio" maxlength="600" placeholder="A short introduction about you">${esc(u.bio||'')}</textarea>
            <div class="row"><div><label for="pv">Values</label><input id="pv" value="${esc(u.values||'')}"></div><div><label for="pi">Interests and skills</label><input id="pi" value="${esc(u.interests||'')}" placeholder="Comma separated"></div></div>
            <label for="pp">Experience and projects</label><textarea id="pp">${esc(u.projects||'')}</textarea>
            <div class="row"><div><label for="linkedin">LinkedIn URL</label><input id="linkedin" type="url" value="${esc(u.linkedin||'')}" placeholder="https://www.linkedin.com/in/you"></div><div><label for="github">GitHub URL</label><input id="github" type="url" value="${esc(u.github||'')}" placeholder="https://github.com/you"></div><div><label for="portfolio">Portfolio URL</label><input id="portfolio" type="url" value="${esc(u.portfolio||'')}" placeholder="https://your-site.example"></div><div><label for="cv">CV file</label><input class="profile-input-file" id="cv" type="file" accept=".pdf,.doc,.docx"><p class="mut">Accepted formats: PDF, DOC, or DOCX. Maximum file size: 6 MB.</p></div></div>
            <p class="mut">Files stay in this demo session. Profile photos must be JPG, PNG, or WebP up to 2 MB.</p><button class="b" onclick="saveProf()">Save profile</button>
        </details></article>`
 }
 return `<h2>Your profile</h2><div class="panel">Profile details are available for student accounts.</div>`}
function profileImageSource(value){const source=String(value||'');if(/^data:image\/(?:jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(source))return source;try{const url=new URL(source);return url.protocol==='https:'?url.href:''}catch{return ''}}
function profileLink(label,value){const raw=String(value||'').trim();if(!raw)return '';try{const url=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);if(!['http:','https:'].includes(url.protocol))return '';return `<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`}catch{return ''}}
function readProfileFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
async function saveProf(){const u=me(),photo=$('photo').files[0],cv=$('cv').files[0];if(photo&&(!['image/jpeg','image/png','image/webp'].includes(photo.type)||photo.size>2*1024*1024))return toast('Choose a JPG, PNG, or WebP image smaller than 2 MB.');if(cv&&!['pdf','doc','docx'].includes(cv.name.split('.').pop().toLowerCase()))return toast('Choose a CV in PDF, DOC, or DOCX format.');if(cv&&cv.size>6*1024*1024)return toast('Choose a CV smaller than 6 MB.');
 Object.assign(u,{name:$('pn').value.trim(),headline:$('ph').value.trim(),loc:$('pl').value.trim(),bio:$('pbio').value.trim(),values:$('pv').value.trim(),interests:$('pi').value.trim(),projects:$('pp').value.trim(),linkedin:$('linkedin').value.trim(),github:$('github').value.trim(),portfolio:$('portfolio').value.trim()});
 try{if(photo)u.photo=await readProfileFile(photo);if(cv){u.cv=cv.name;u.cvData=await readProfileFile(cv)}}catch{return toast('The selected file could not be read.')};toast('Profile saved');render()}
function vis(p){const u=me();if(p.status!=='live')return false;
 if(u.role==='student')return p.type==='none'||!!p.employeeId;
 return p.type!=='none'&&(!p.employeeId||p.employeeId===u.id)}
function browse(){const u=me(),stu=u.role==='student';
 return `<h2>${stu?'Find a project':'Projects that need a company'}</h2><p class="mut">${stu?'Search by keyword, sector, time and location.':'Charities want a mentor, collaborator or shadow host. Offer to help, and the charity picks one company employee.'}</p>
 ${stu?matchShortlist():''}
 <div class="bar"><input id="fq" placeholder="Keyword, e.g. website" value="${esc(S.f.q)}" oninput="S.f.q=this.value;list()" aria-label="Keyword"><select id="fs" onchange="S.f.sector=this.value;list()" aria-label="Sector"><option value="">All sectors</option>${SECTORS.map(s=>`<option ${S.f.sector===s?'selected':''}>${s}</option>`).join('')}</select>
 <select onchange="S.f.time=this.value;list()" aria-label="Time required"><option value="">Any time</option><option value="s" ${S.f.time==='s'?'selected':''}>Under 5 hours</option><option value="m" ${S.f.time==='m'?'selected':''}>5 to 20 hours</option><option value="l" ${S.f.time==='l'?'selected':''}>Over 20 hours</option></select>
 <input placeholder="Location" value="${esc(S.f.loc)}" oninput="S.f.loc=this.value;list()" aria-label="Location"></div><div class="grid" id="list">${cards()}</div>`}
function matchShortlist(){const state=S.matchState;
 const status=state.loading?'<p class="match-state" role="status">Reviewing your CV against projects…</p>':state.error?`<p class="match-state match-error" role="alert">${esc(state.error)}</p>`:state.checked&&!state.results.length?'<p class="match-state">No compatible projects came back this time. Browse all opportunities below.</p>':'';
 const results=state.results.map(match=>`<article class="match-result"><div class="match-result-head"><h4>${esc(match.project_title)}</h4><span class="match-score">${match.match_score}% match</span></div>${match.summary_reason?`<p>${esc(match.summary_reason)}</p>`:''}${match.skill_alignment.length?`<p><b>Skill alignment:</b> ${match.skill_alignment.map(esc).join(', ')}</p>`:''}${match.experience_alignment?`<p><b>Experience:</b> ${esc(match.experience_alignment)}</p>`:''}${match.interest_fit?`<p><b>Interest fit:</b> ${esc(match.interest_fit)}</p>`:''}</article>`).join('');
 return `<section class="match-shortlist" aria-labelledby="matchTitle"><div class="match-heading"><div><h3 id="matchTitle">Projects picked for you</h3><p>${state.results.length?'Here are the best picks for you.':'Upload your CV to get a project shortlist.'}</p><p class="mut">Accepted formats: PDF, DOC, or DOCX. Maximum file size: 6 MB.</p></div><div><button class="b" onclick="$('matchCv').click()" ${state.loading?'disabled':''}>${state.loading?'Finding matches…':'Upload CV and find matches'}</button><input id="matchCv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="scanCV(this.files[0]);this.value=''" hidden></div></div>${status}${results?`<div class="match-results">${results}</div>`:''}</section>`}
async function scanCV(file){const u=me();if(!u||u.role!=='student'||!file)return;
 const extension=file.name.split('.').pop().toLowerCase();if(!['pdf','doc','docx'].includes(extension)){S.matchState={loading:false,error:'Choose a PDF, DOC, or DOCX CV.',results:[],candidateSummary:'',checked:false};render();return}
 if(file.size>6*1024*1024){S.matchState={loading:false,error:'Choose a CV smaller than 6 MB.',results:[],candidateSummary:'',checked:false};render();return}
 const studentId=u.id;S.matchState={loading:true,error:'',results:[],candidateSummary:'',checked:false};render();
 try{const body=new FormData();body.append('file',file,file.name);
  const response=await fetch(MATCH_API_URL,{method:'POST',body});if(!response.ok){const errorBody=await response.json().catch(()=>({}));throw new Error(errorBody.detail||errorBody.error||`Matching service returned ${response.status}.`)}
  const data=await response.json();if(!Array.isArray(data.shortlist))throw new Error('The matching service returned an invalid response.');
  if(!S.user||S.user.id!==studentId)return;
  const results=data.shortlist.map(match=>{if(!match||typeof match.project_title!=='string')return null;const score=Number(match.match_score);if(!Number.isFinite(score))return null;return{project_title:match.project_title,match_score:Math.max(0,Math.min(100,Math.round(score))),skill_alignment:Array.isArray(match.skill_alignment)?match.skill_alignment.map(String):[],experience_alignment:String(match.experience_alignment||''),interest_fit:String(match.interest_fit||''),summary_reason:String(match.summary_reason||'')}}).filter(Boolean);
  S.matchState={loading:false,error:'',results,candidateSummary:String(data.candidate_summary||''),checked:true};render();
 }catch(error){if(!S.user||S.user.id!==studentId)return;S.matchState={loading:false,error:error instanceof TypeError?'Could not reach http://127.0.0.1:8000/api/scan. Start the matching API and try again.':error.message,results:[],candidateSummary:'',checked:true};render()}}
function list(){$('list').innerHTML=cards()}
function cards(){const f=S.f,u=me(),stu=u.role==='student';
 const a=S.projects.filter(p=>vis(p)&&(!f.sector||p.sector===f.sector)&&(!f.loc||p.loc.toLowerCase().includes(f.loc.toLowerCase()))&&
 (!f.time||(f.time==='s'?p.hours<5:f.time==='m'?p.hours>=5&&p.hours<=20:p.hours>20))&&
 (!f.q||(p.title+p.what+p.skills+p.sector).toLowerCase().includes(f.q.toLowerCase())));
 return a.length?a.map(p=>{const done=S.apps.some(x=>x.projectId===p.id&&x.userId===u.id);return `<article class="proj"><h3>${esc(p.title)}</h3><div><span class="tag y">${TYPES[p.type]}</span><span class="tag">${p.sector}</span><span class="tag">${esc(p.loc)}</span><span class="tag">~${p.hours} hrs</span></div>
 <div>${esc(p.what)}</div><div class="mut"><b>Why it matters:</b> ${esc(p.why)}</div><div class="mut">By ${esc(ch(p.charityId).name)} · Skills: ${esc(p.skills)} · Deadline ${esc(p.deadline)} · Budget ${esc(p.budget)}</div>
 ${p.employeeId?`<div class="mut">Mentor company: ${esc(co(ch(p.employeeId)).name)}</div>`:''}
 <button class="b sm" ${done?'disabled':''} onclick="apply(${p.id})">${done?'Already sent':stu?(p.employeeId?'Apply to mentor':'Offer to help'):'Offer to help'}</button></article>`}).join(''):`<div class="panel">No projects match yet. Clear a filter or check back soon.</div>`}
function apply(id){const p=pr(id),u=me();
 if(u.role==='student'&&!u.cv){toast('Add your CV on your profile before applying.');return go('profile')}
 $('dlg').innerHTML=`<h3>${esc(p.title)}</h3><p class="mut">${u.role==='student'&&p.employeeId?'Your offer goes straight to the mentor company, which decides who joins.':'Your offer goes to the charity.'}</p><p class="mut"><b>Requested item:</b> ${esc(p.ask||'A short note')}</p>
 <label for="am">Why you, and how can you help?</label><textarea id="am"></textarea><label for="ax">Requested item (link or text)</label><input id="ax">${u.role==='student'?`<p class="mut">CV attached: ${esc(u.cv)}</p>`:''}
 <p><button class="b" onclick="sendApp(${id})">Send offer</button> <button class="b alt" onclick="$('dlg').close()">Cancel</button></p>`;$('dlg').showModal()}
function sendApp(id){const u=me();if(!$('am').value.trim())return toast('Add a short message first.');

 const a=S.apps.filter(x=>x.userId===u.id);
 return `<h2>${u.role==='student'?'My applications':'My offers'}</h2>${a.length?a.map(x=>{const p=pr(x.projectId);return `<div class="panel"><h3>${esc(p.title)}</h3><span class="tag ${x.status==='accepted'?'g':x.status==='declined'?'r':'y'}">${x.status==='sent'?'Waiting for a decision':x.status==='accepted'?'Chosen!':'Not selected'}</span><p class="mut">${p.employeeId&&u.role==='student'?'Decided by '+esc(co(ch(p.employeeId)).name):'Decided by '+esc(ch(p.charityId).name)}</p></div>`}).join(''):'<div class="panel">Nothing yet. Browse opportunities and send your first offer.</div>'}`}
function post(){const u=me();if(!u.approved)return `<div class="panel">Your charity is awaiting verification.</div>`;
 return `<h2>Submit a project</h2><div class="panel"><label for="t">Project title</label><input id="t"><label for="w">What needs building?</label><textarea id="w"></textarea><label for="y">Why does it matter?</label><textarea id="y"></textarea><label for="s">Skills required</label><input id="s">
 <div class="row"><div><label for="tl">Expected timeline</label><input id="tl" placeholder="e.g. 6 weeks"></div><div><label for="dl">Deadline</label><input id="dl" type="date"></div><div><label for="hr">Hours needed</label><input id="hr" type="number" min="1" value="10"></div><div><label for="bd">Budget</label><input id="bd" placeholder="£0 / £500"></div>

 const rows=S.apps.filter(x=>{const p=pr(x.projectId);if(u.role==='charity')return p.charityId===u.id&&(ch(x.userId).role==='employee'||!p.employeeId);return p.employeeId===u.id&&ch(x.userId).role==='student'});

function admin(){const q=[...S.companies.filter(c=>!c.verified).map(c=>['Company',c.name+' ('+c.domain+')',()=>`S.companies.find(c=>c.id==${c.id}).verified=true`]),
 ...S.users.filter(u=>!u.approved&&u.role==='charity').map(u=>['Charity',u.name+' · reg. no. '+u.charityNo+' (check Charity Commission register)',()=>`ch(${u.id}).approved=true`]),
 ...S.users.filter(u=>!u.approved&&u.role==='employee').map(u=>['Employee',u.name+' at '+co(u).name+(u.leadOk?'':' (company lead has not approved yet)'),()=>`ch(${u.id}).approved=true`]),
 ...S.projects.filter(p=>p.status==='pending').map(p=>['Project',p.title+' · budget '+p.budget+' · '+TYPES[p.type],()=>`pr(${p.id}).status='live'`])];
 return `<h2>Review queue</h2>${q.length?q.map(([k,t,f])=>`<div class="item"><span><span class="tag y">${k}</span>${esc(t)}</span><button class="b sm" onclick="${f()};toast('Approved');render()">Approve</button></div>`).join(''):'<div class="panel">Everything is reviewed.</div>'}`}
render();
</script>
</body>
</html>
