<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Issue – skills for charities</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#25243b;--paper:#fffdf9;--card:#fff;--v:#766ab4;--vs:#f0edfa;--sun:#ffc93c;--co:#ff6b57;--ok:#1f9d6b;--mut:#686579;--line:#e8e4ef}
html[data-theme="student"]{--paper:#f4faf6;--v:#246342;--vs:#dcecdf;--line:#d0e2d5}
html[data-theme="company"]{--paper:#f4f7fc;--v:#385d94;--vs:#dce6f4;--line:#d0dced}
html[data-theme="charity"]{--paper:#fcf6f2;--v:#984b34;--vs:#f2e0d7;--line:#ead5ca}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.05;margin:0 0 .5em}
h1{font-size:5rem;font-weight:800;letter-spacing:0}
h2{font-size:1.8rem}h3{font-size:1.15rem}
a{color:var(--v)}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:5}
.logo{font:800 1.4rem 'Bricolage Grotesque';margin-right:auto;cursor:pointer;background:var(--sun);color:#14112b;padding:2px 10px;transform:rotate(-2deg)}
nav button{background:none;border:0;color:var(--ink);font:600 .95rem Figtree;padding:8px 10px;cursor:pointer;border-radius:8px}
nav button.on,nav button:hover{background:var(--vs)}
button,.btn{font:600 1rem Figtree;cursor:pointer}
.b{background:var(--v);color:#fff;border:2px solid var(--ink);padding:10px 18px;border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.b.alt{background:var(--card);color:var(--ink)}.b.no{background:var(--co);color:#14112b}.b.sm{padding:5px 12px;font-size:.9rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;padding:54px 0 40px}
.hero-copy{position:relative;z-index:1;animation:arrive .55s ease-out both}
.hero-kicker{display:inline-flex;align-items:center;gap:9px;margin-bottom:20px;padding:6px 10px;border:2px solid var(--ink);background:var(--sun);font-size:.78rem;font-weight:700;text-transform:uppercase}
.hero-kicker:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
.hero h1{max-width:9ch;font-size:4.8rem;line-height:.94;letter-spacing:0}
.hero h1 em{color:var(--v);font-style:normal}
.hero p{font-size:1.12rem;max-width:36ch;margin:18px 0 22px;color:var(--mut)}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-actions a{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.hero-note{margin-top:22px;color:var(--mut);font-size:.84rem}
.project-showcase{padding:16px 0 24px}
.project-showcase-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}
.project-showcase-head p{max-width:46ch;margin:0;color:var(--mut)}
.project-showcase .proj{animation:arrive .45s ease-out both}
.project-showcase .proj:nth-child(2){animation-delay:.04s}.project-showcase .proj:nth-child(3){animation-delay:.08s}
.tix{position:relative;min-height:330px;overflow:hidden;padding:26px;background:#126b65;border:2px solid var(--ink);box-shadow:7px 7px 0 var(--ink);animation:arrive .7s .08s ease-out both}
.tix:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1px,transparent 1px);background-size:15px 15px;opacity:.65}
.tk{position:relative;z-index:1;width:82%;background:var(--card);border:2px solid var(--ink);padding:18px;box-shadow:5px 5px 0 var(--ink)}
.tk:nth-child(1){transform:rotate(-2deg)}
.tk:nth-child(2){position:absolute;right:14px;bottom:20px;width:auto;max-width:56%;padding:13px 15px;background:var(--sun);color:#14112b;transform:rotate(3deg)}
.tk:nth-child(3){display:inline-flex;align-items:center;gap:9px;width:auto;margin:18px 0 0 12px;padding:9px 12px;background:#f58b70;color:#14112b;transform:rotate(-4deg);font-size:.83rem;font-weight:700}
.tk .brief-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px;color:var(--mut);font-size:.74rem;font-weight:700;text-transform:uppercase}
.tk .brief-title{display:block;max-width:18ch;font:800 1.65rem/1.05 'Bricolage Grotesque',sans-serif}
.tk .brief-copy{margin:8px 0 14px;color:var(--mut);font-size:.9rem}
.brief-skills{display:flex;gap:6px;flex-wrap:wrap}
.brief-skills span{padding:4px 7px;border:1px solid var(--ink);font-size:.68rem;font-weight:700}
.tk .match-score{display:block;font:800 1.55rem 'Bricolage Grotesque',sans-serif}
.tk .match-caption{font-size:.72rem;font-weight:700;text-transform:uppercase}
@keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0 50px}
.role{text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:20px;box-shadow:5px 5px 0 var(--ink);transition:transform .15s}
.role[data-role="student"]{background:#dcecdf;border-color:#246342}.role[data-role="company"]{background:#dce6f4;border-color:#385d94}.role[data-role="charity"]{background:#f2e0d7;border-color:#984b34}
.auth-panel{border-top:8px solid var(--v)}
.role:hover{transform:translate(-2px,-2px)}.role strong{font:800 1.5rem 'Bricolage Grotesque';display:block}.role span{color:var(--mut);font-size:.95rem}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.proj{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.charity-link{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%;padding:0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer}
.charity-link:hover strong{text-decoration:underline}
.charity-link small{display:block;color:var(--mut);font-size:.8rem}
.charity-mark{display:grid;place-items:center;flex:none;width:42px;height:42px;padding:3px;border:2px solid var(--ink);border-radius:8px;background:var(--brand,#dce9f2);color:#fff;font:800 .62rem/1 Figtree,sans-serif;text-align:center}
.charity-project{padding:12px 0;border-top:1px solid var(--line)}
.tag{display:inline-block;font-size:.8rem;font-weight:600;background:var(--vs);padding:2px 10px;border-radius:99px;margin:0 4px 4px 0}
.tag.y{background:var(--sun);color:#14112b}.tag.g{background:#c9f2e0;color:#0b5238}.tag.r{background:#ffd9d3;color:#7a1d10}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:9px 11px}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar>*{flex:1;min-width:140px}
.mut{color:var(--mut);font-size:.92rem}
.err{background:#ffd9d3;color:#7a1d10;padding:10px 14px;border-radius:8px;margin:10px 0;font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:10px;z-index:20;max-width:90vw;display:none}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);max-width:520px;width:92vw}
.item{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
footer{padding:30px 20px;text-align:center}
@media(max-width:760px){h1{font-size:3.3rem}.hero{grid-template-columns:1fr;gap:24px;padding-top:36px}.hero h1{max-width:11ch;font-size:3.3rem}.tix{min-height:300px;padding:20px}.tk{width:90%}.tk:nth-child(2){max-width:58%}.project-showcase-head{display:block}.project-showcase-head p{margin-top:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="nav"></div>
<main id="app" class="wrap"></main>
<footer class="mut">Skill Issue · built for the IKU Womxn in STEM Hackathon · All demo opportunities are fictional; the Oxfam concept is not an official or affiliated opportunity.<br><button class="b sm alt" onclick="demo('admin')" style="margin-top:10px">Platform reviewer demo</button></footer>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let _id=100;const nid=()=>++_id;
const SECTORS=['Technology','Legal','Education','Health','Environment','Arts','Finance','Community'];
const TYPES={none:'Direct volunteering',shadow:'Shadowing',mentor:'Mentoring',both:'Shadowing + mentoring'};
const YEARS=['A-level Year 12','A-level Year 13','University Year 1','University Year 2','Beyond second year'];
const FREE=/@(gmail|yahoo|hotmail|outlook|icloud|live|aol|proton(mail)?|me)\./i;
const STU=/(\.ac\.[a-z]{2}|\.edu(\.[a-z]{2})?$|\.sch\.uk|school|college|academy|sixthform)/i;
const dom=e=>e.split('@')[1]||'';
const S={user:null,view:'home',role:null,mode:'up',pend:null,f:{q:'',sector:'',time:'',loc:''},
users:[
{id:1,role:'student',email:'amara@kcl.ac.uk',pw:'demo',name:'Amara Okafor',loc:'London',year:'University Year 1',values:'Fairness, curiosity',interests:'web design, data, accessibility',projects:'Built a school timetable app',cv:'amara_cv.pdf',approved:true},
{id:2,role:'company',email:'lead@northline.com',pw:'demo',name:'Priya Shah',companyId:1,approved:true},
{id:3,role:'employee',email:'jo@northline.com',pw:'demo',name:'Jo Bennett',companyId:1,loc:'London',approved:true},
{id:4,role:'charity',email:'hello@greenroots.org.uk',pw:'demo',name:'Green Roots',loc:'Manchester',values:'Community, sustainability',charityNo:'1234567',about:'A local community group creating greener shared spaces and helping neighbours take part in practical environmental projects.',focus:'Community gardens, urban nature, environmental education',serves:'Local residents, families and volunteer groups',waysToHelp:'Garden days, event promotion, accessible digital tools',logo:'GR',brandColor:'#28734a',approved:true}],
companies:[{id:1,name:'Northline Capital',loc:'London',sector:'Finance',desc:'Trading and technology firm with a volunteering programme.',domain:'northline.com',verified:true}],
charities:[
{id:5,name:'Oxfam GB',loc:'United Kingdom and internationally',about:'Oxfam GB is part of a global confederation working with people and partners to tackle poverty and inequality. Its work includes humanitarian response, campaigning for change and supporting communities facing crises.',focus:'Poverty and inequality, humanitarian response, climate justice, gender justice',serves:'People and communities affected by poverty, inequality and humanitarian emergencies',waysToHelp:'Learn about campaigns, fundraise, volunteer, or explore current roles through Oxfam’s official website',website:'https://www.oxfam.org.uk/',logo:'OXFAM',brandColor:'#14558f',demoOnly:true},
{id:6,name:'Northside Community Pantry',loc:'Manchester',about:'A fictional neighbourhood food project connecting local residents with affordable groceries and community support.',focus:'Food access, community connection, waste reduction',serves:'Residents facing food insecurity in the local area',waysToHelp:'Share service information, create accessible campaign materials, volunteer at pantry sessions',logo:'NCP',brandColor:'#b34d32'},
{id:7,name:'North West Housing Advice',loc:'North West England',about:'A fictional community advice charity helping residents understand housing support and find trusted local services. Legal information projects are reviewed by qualified advisers before publication.',focus:'Housing advice, tenant support, access to services',serves:'Renters and households seeking housing support',waysToHelp:'Create plain-language resources, improve service directories, support supervised advice sessions',logo:'NWHA',brandColor:'#356477'},
{id:8,name:'ByteBack Digital Skills',loc:'Manchester',about:'A fictional education charity helping young people and adults build confidence with technology through free workshops and mentoring.',focus:'Digital inclusion, technology education, mentoring',serves:'Young people and adults with limited access to digital skills training',waysToHelp:'Mentor learners, improve workshop tools, build accessible learning materials',logo:'BYTE',brandColor:'#345b9a'},
{id:9,name:'ClearPath Community Health',loc:'Manchester',about:'A fictional community health charity making local wellbeing services easier to find and access.',focus:'Community wellbeing, health information, service access',serves:'Local residents looking for accessible wellbeing support',waysToHelp:'Improve service information, design accessible materials, help organize community events',logo:'CPH',brandColor:'#287c70'}],
projects:[
{id:1,charityId:4,title:'Volunteer sign-up website',what:'A simple responsive website where locals can sign up for garden days.',why:'Our paper sign-up sheets lose people. A site would double our volunteers.',skills:'HTML, CSS, JavaScript, design',timeline:'6 weeks',deadline:'2026-12-15',budget:'£0 (volunteer led)',type:'mentor',sector:'Technology',loc:'Manchester',hours:25,ask:'Link to any past web project',status:'live',employeeId:null},
{id:2,charityId:4,title:'Leaflet design for open day',what:'Print-ready A5 leaflet.',why:'Reaches households without internet.',skills:'Graphic design',timeline:'2 weeks',deadline:'2026-11-20',budget:'£50 printing',type:'none',sector:'Arts',loc:'Manchester',hours:4,ask:'Portfolio or sketches',status:'live',employeeId:null},
{id:3,charityId:5,title:'Digital poster for a new community initiative',what:'Create a bright, accessible digital poster introducing a fictional “Share, Repair, Reuse” community initiative for social media and email.',why:'A clear campaign visual can help more people discover the initiative and take part.',skills:'Graphic design, Digital marketing, Accessibility',timeline:'2 weeks',deadline:'2026-12-01',budget:'Volunteer project',type:'none',sector:'Arts',loc:'Remote',hours:12,ask:'Portfolio or sample poster',status:'live',employeeId:null},
{id:4,charityId:4,title:'Accessible volunteer welcome video',what:'Edit a short welcome video with captions and a clear call to action for new garden volunteers.',why:'A short, captioned introduction helps more people feel confident joining their first event.',skills:'Video editing, Accessibility, Content writing',timeline:'3 weeks',deadline:'2026-12-10',budget:'Volunteer led',type:'none',sector:'Technology',loc:'Manchester',hours:10,ask:'A video sample or editing reel',status:'live',employeeId:null},
{id:5,charityId:6,title:'Social campaign for the winter pantry',what:'Design a small set of digital posts explaining pantry opening times and how neighbours can access support.',why:'Residents need clear, welcoming information that is easy to share on mobile.',skills:'Graphic design, Digital marketing, Accessibility',timeline:'2 weeks',deadline:'2026-12-05',budget:'Volunteer project',type:'none',sector:'Community',loc:'Manchester',hours:8,ask:'A sample social post or design portfolio',status:'live',employeeId:null},
{id:6,charityId:4,title:'Volunteer garden-day booking tool',what:'Build a simple mobile-friendly booking page so neighbours can choose a garden session and see what to bring.',why:'A clear booking flow will reduce missed messages and make it easier for new volunteers to join.',skills:'Web Development, UI/UX Design, Accessibility',timeline:'4 weeks',deadline:'2027-01-15',budget:'Volunteer led',type:'none',sector:'Technology',loc:'Manchester',hours:24,ask:'A link to a website or prototype',status:'live',employeeId:null},
{id:7,charityId:7,title:'Plain-language housing rights guide',what:'Help turn adviser-approved housing information into a clear, accessible online guide with links to trusted support.',why:'Residents need reliable information they can understand before contacting an advice service.',skills:'Legal research, Plain-language writing, Accessibility',timeline:'4 weeks',deadline:'2027-01-20',budget:'Volunteer project',type:'none',sector:'Legal',loc:'Remote',hours:18,ask:'A writing or research sample',status:'live',employeeId:null},
{id:8,charityId:8,title:'Digital skills workshop booking page',what:'Create a small page where learners can view free workshop dates and reserve a place.',why:'A simple sign-up route will help more people access practical digital-skills sessions.',skills:'Web Development, UI/UX Design, Accessibility',timeline:'5 weeks',deadline:'2027-01-25',budget:'Volunteer led',type:'none',sector:'Education',loc:'Manchester',hours:30,ask:'A website or design portfolio',status:'live',employeeId:null},
{id:9,charityId:9,title:'Community clinic service finder',what:'Design an accessible directory page for local wellbeing services, with opening times and contact details.',why:'People should be able to find the right local service quickly, especially on a phone.',skills:'Web Development, Data Analysis, Accessibility',timeline:'4 weeks',deadline:'2027-02-01',budget:'Volunteer project',type:'none',sector:'Health',loc:'Manchester',hours:28,ask:'A relevant project sample',status:'live',employeeId:null}],
apps:[]};
const me=()=>S.user, co=u=>S.companies.find(c=>c.id===u.companyId), ch=id=>S.users.find(u=>u.id===id)||S.charities.find(c=>c.id===id), pr=id=>S.projects.find(p=>p.id===id);
function toast(m,ms=4500){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}
function go(v){S.view=v;render();scrollTo(0,0)}
function render(){
 const u=me(),themeRole=u?.role||(S.view==='auth'||S.view==='verify'?S.role||S.pend?.role:null);
 document.documentElement.dataset.theme=themeRole==='employee'?'company':(['student','company','charity'].includes(themeRole)?themeRole:'');
 const tabs=!u?[]:{student:[['browse','Opportunities'],['mine','My applications'],['profile','Profile']],
 employee:[['browse','Open projects'],['mine','My offers'],['decide','Student applications'],['profile','Profile']],
 company:[['profile','Company'],['team','Employees']],
 charity:[['mine','My projects'],['post','Submit project'],['decide','Offers received']],
 admin:[['admin','Review queue']]}[u.role];
 $('nav').innerHTML=`<nav><span class="logo" onclick="go('home')">Skill Issue</span>`+tabs.map(t=>`<button class="${S.view===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+(u?`<button onclick="S.user=null;go('home')">Log out (${esc(u.name)})</button>`:`<button onclick="go('home')">Home</button>`)+`</nav>`;
 const V={home,auth,verify,browse,mine,profile,post,decide,team,admin};
 $('app').innerHTML=(u&&S.view==='home'?dash():V[S.view]())
}
function home(){return `<section class="hero"><div class="hero-copy"><div class="hero-kicker">Skills in service · projects with purpose</div><h1>Good skills.<br><em>Real good.</em></h1><p>Charities have a mission. You have a skill. Bring them together on useful projects that make a difference in the real world.</p><div class="hero-actions"><a class="b" href="#open-projects">Find your next project <span aria-hidden="true">↘</span></a><button class="b alt" onclick="S.role='charity';S.mode='up';go('auth')">I'm a charity</button></div><div class="hero-note">Creative work · Digital skills · Community impact</div></div>
<div class="tix" aria-label="Example digital campaign project"><div class="tk"><div class="brief-label"><span>Open brief / Community</span><span>01—03</span></div><strong class="brief-title">Make the good stuff impossible to miss.</strong><p class="brief-copy">A digital campaign poster for a local community pantry.</p><div class="brief-skills"><span>Graphic design</span><span>Accessibility</span></div></div><div class="tk"><span class="match-caption">A little time can go a long way</span><strong class="match-score">08 hrs</strong><span>Estimated project time</span></div><div class="tk">DESIGN <span aria-hidden="true">+</span> IMPACT</div></div></section>
<h2 id="role-choices">Where do you fit?</h2><div class="roles">${[['student','Student','A-level to second-year. Find real projects and mentors.'],['company','Company','Register your firm, verify, and let employees mentor or shadow.'],['charity','Charity','Post what you need built. Get skilled help.']].map(r=>`<button class="role" data-role="${r[0]}" onclick="S.role='${r[0]}';S.mode='up';go('auth')"><strong>${r[1]}</strong><span>${r[2]}</span></button>`).join('')}</div>
<section id="open-projects" class="project-showcase"><div class="project-showcase-head"><div><h2>Open projects</h2><p>Explore sample briefs from fictional charities before you create an account.</p></div><span class="tag g">${S.projects.filter(p=>p.status==='live').length} opportunities</span></div><div class="grid">${homeProjects()}</div></section>
<div class="panel"><h3>Try the demo quickly</h3><p class="mut">Choose a sample student or company account. Password for every demo login: <b>demo</b>.</p>
<p><b>Students</b><br>${[['student1','Amara · London'],['student2','Leila · Manchester'],['student3','Owen · Leeds']].map(([r,n])=>`<button class="b sm alt" onclick="demo('${r}')">${n}</button> `).join('')}</p>
<p><b>Companies</b><br>${[['company1','Northline Capital'],['company2','BrightPath Studio'],['company3','Copperleaf Creative']].map(([r,n])=>`<button class="b sm alt" onclick="demo('${r}')">${n}</button> `).join('')}</p>
<p class="mut">Also available: <button class="b sm alt" onclick="demo('employee')">Northline mentor</button> <button class="b sm alt" onclick="demo('charity')">Green Roots charity</button></p></div>`}
function homeProjects(){return S.projects.filter(p=>p.status==='live').map(p=>{const charity=ch(p.charityId),mark=charityMark(charity);return `<article class="proj"><button class="charity-link" onclick="openCharity(${charity.id})" aria-label="View ${esc(charity.name)} charity profile"><span class="charity-mark" style="--brand:${esc(mark.color)}">${esc(mark.label)}</span><span><strong>${esc(charity.name)}</strong><small>View charity profile and projects</small></span></button><h3>${esc(p.title)}</h3><div><span class="tag y">${esc(p.sector)}</span><span class="tag">${esc(p.loc)}</span><span class="tag">~${esc(p.hours)} hrs</span></div><div>${esc(p.what)}</div><div class="mut"><b>Skills:</b> ${esc(p.skills)}</div><button class="b sm" onclick="S.role='student';S.mode='up';go('auth')">Offer to help</button></article>`}).join('')}
function demo(r){S.user=r==='admin'?{id:0,role:'admin',name:'Reviewer'}:S.users.find(u=>u.role===r);go(r==='admin'?'admin':'home')}
function dash(){const u=me();if(u.role==='student')return browse();if(u.role==='employee')return browse();if(u.role==='company')return profile();if(u.role==='charity')return mine();return admin()}
function auth(){const r=S.role||'student',up=S.mode==='up',cos=S.companies.filter(c=>c.verified);
 return `<div class="panel auth-panel" style="max-width:600px;margin:30px auto"><h2>${up?'Create':'Log in to'} your ${r} account</h2>
 <p class="mut">${up?'Use your own '+({student:'school or university',charity:'charity',company:'company'}[r])+' email. Free email addresses are not accepted.':''}</p><div id="err"></div>
 ${up?`<label for="n">${r==='charity'?'Charity name':'Full name'}</label><input id="n">`:''}
 <label for="e">Email</label><input id="e" type="email"><label for="p">Password</label><input id="p" type="password">
 ${up&&r==='student'?`<label for="y">Current study stage</label><select id="y">${YEARS.map(y=>`<option>${y}</option>`).join('')}</select>`:''}
 ${up&&r==='charity'?`<label for="cn">Charity Commission registration number</label><input id="cn" inputmode="numeric" placeholder="e.g. 1234567"><label for="l">Location</label><input id="l"><label for="v">Values</label><textarea id="v"></textarea>`:''}
 ${up&&r==='company'?`<label for="k">I am</label><select id="k" onchange="$('nc').style.display=this.value==='new'?'block':'none';$('ex').style.display=this.value==='new'?'none':'block'"><option value="new">Registering a new company</option><option value="emp">An employee of a registered company</option></select>
 <div id="ex" style="display:none"><label for="cc">Company</label><select id="cc">${cos.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div id="nc"><label for="cn2">Company name</label><input id="cn2"><label for="cl">Location</label><input id="cl"><label for="cs">Sector</label><select id="cs">${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select><label for="cd">Description</label><textarea id="cd"></textarea></div>`:''}
 <p><button class="b" onclick="${up?'signup()':'login()'}">${up?'Create account':'Log in'}</button> <button class="b alt" onclick="S.mode='${up?'in':'up'}';render()">${up?'I have an account':'Create account'}</button></p></div>`}
const err=m=>$('err').innerHTML=`<div class="err" role="alert">${m}</div>`;
function login(){const u=S.users.find(x=>x.email===$('e').value.trim().toLowerCase()&&x.pw===$('p').value);
 if(!u)return err('Email or password not recognised.');if(u.role!==S.role)return err(`This email is registered as a ${u.role}. Pick that role on the home page.`);
 if(!u.approved)return err('Your account is still waiting for verification.');S.user=u;go('home')}
function signup(){const r=S.role,e=$('e').value.trim().toLowerCase(),n=($('n')||{}).value?.trim(),p=$('p').value;
 if(!/^\S+@\S+\.\S+$/.test(e))return err('Enter a valid email address.');if(!p||p.length<4)return err('Password needs at least 4 characters.');
 if(S.users.some(u=>u.email===e))return err('That email is already registered.');
 if(FREE.test(e))return err('Free email providers are not accepted. Use your organisation email.');
 const d={id:nid(),role:r,email:e,pw:p,name:n,approved:false};
 if(!n)return err('Name is required.');
 if(r==='student'){if(!STU.test(e))return err('Student emails must be a school, college or university address (for example .ac.uk).');
  const y=$('y').value;if(y==='Beyond second year')return err('Skill Issue is for A-level students up to second-year university students.');d.year=y}
 if(r==='charity'){const c=$('cn').value.trim();if(!/^\d{6,8}$/.test(c))return err('Enter a valid 6 to 8 digit Charity Commission registration number.');
  Object.assign(d,{charityNo:c,loc:$('l').value,values:$('v').value})}
 if(r==='company'){if($('k').value==='new'){const nm=$('cn2').value.trim();if(!nm)return err('Company name is required.');
  const c={id:nid(),name:nm,loc:$('cl').value,sector:$('cs').value,desc:$('cd').value,domain:dom(e),verified:false};S.companies.push(c);d.companyId=c.id}
  else{const c=S.companies.find(c=>c.id==$('cc').value);if(!c)return err('No verified company to join yet.');if(dom(e)!==c.domain)return err('Your email must end @'+c.domain+' to join '+c.name+'.');d.role='employee';d.companyId=c.id}}
 d.code=String(Math.floor(100000+Math.random()*900000));S.pend=d;go('verify');toast('Demo inbox: your verification code is '+d.code,15000)}
function verify(){return `<div class="panel auth-panel" style="max-width:520px;margin:30px auto"><h2>Check your email</h2><p>We sent a 6-digit code to <b>${esc(S.pend.email)}</b>.</p><div id="err"></div><label for="c">Code</label><input id="c" inputmode="numeric" maxlength="6"><p><button class="b" onclick="confirmCode()">Verify email</button></p></div>`}
function confirmCode(){const d=S.pend;if($('c').value!==d.code)return err('That code is not right. Try again.');
 S.users.push(d);S.pend=null;const msg={student:'Verified! You can log in now.',charity:'Email verified. The platform team will now check your Charity Commission number.',company:'Email verified. The platform team will now verify your company.',employee:'Email verified. Your company lead must approve you, then the platform verifies you.'}[d.role];
 if(d.role==='student')d.approved=true;S.role=d.role==='employee'?'company':d.role;S.mode='in';go('auth');toast(msg,7000)}
function profile(){const u=me(),c=u.companyId&&co(u);
 if(u.role==='company'||u.role==='employee')return `<h2>${u.role==='company'?'Company profile':'Your profile'}</h2><div class="panel"><h3>${esc(c.name)} ${c.verified?'<span class="tag g">Verified</span>':'<span class="tag y">Awaiting verification</span>'}</h3><p>${esc(c.desc)}</p><p class="mut">${esc(c.loc)} · ${esc(c.sector)}</p></div>
 ${u.role==='employee'?`<div class="panel"><h3>${esc(u.name)}</h3><label for="pl">Location</label><input id="pl" value="${esc(u.loc)}"><p class="mut">Employer: ${esc(c.name)}</p><button class="b" onclick="me().loc=$('pl').value;toast('Profile saved')">Save profile</button></div>`:''}`
 return `<h2>Your profile</h2><div class="panel"><div class="row"><div><label for="pn">Name</label><input id="pn" value="${esc(u.name)}"></div><div><label for="pl">Location</label><input id="pl" value="${esc(u.loc)}"></div></div>
 <label for="pv">Values</label><textarea id="pv">${esc(u.values)}</textarea><label for="pi">Interests (comma separated)</label><input id="pi" value="${esc(u.interests)}"><label for="pp">Previous projects</label><textarea id="pp">${esc(u.projects)}</textarea>
 <label for="cv">CV (PDF)</label><input id="cv" type="file" accept=".pdf,.doc,.docx"><p class="mut">Current CV: ${esc(u.cv||'none uploaded yet')}</p><p><button class="b" onclick="saveProf()">Save profile</button></p></div>`}
function saveProf(){const u=me(),f=$('cv').files[0];Object.assign(u,{name:$('pn').value,loc:$('pl').value,values:$('pv').value,interests:$('pi').value,projects:$('pp').value});if(f)u.cv=f.name;toast('Profile saved');render()}
function vis(p){const u=me();if(p.status!=='live')return false;
 if(u.role==='student')return p.type==='none'||!!p.employeeId;
 return p.type!=='none'&&(!p.employeeId||p.employeeId===u.id)}
function browse(){const u=me(),stu=u.role==='student';
 return `<h2>${stu?'Find a project':'Projects that need a company'}</h2><p class="mut">${stu?'Search by keyword, sector, time and location.':'Charities want a mentor, collaborator or shadow host. Offer to help, and the charity picks one company employee.'}</p>
 <div class="bar"><input id="fq" placeholder="Keyword, e.g. website" value="${esc(S.f.q)}" oninput="S.f.q=this.value;list()" aria-label="Keyword"><select id="fs" onchange="S.f.sector=this.value;list()" aria-label="Sector"><option value="">All sectors</option>${SECTORS.map(s=>`<option ${S.f.sector===s?'selected':''}>${s}</option>`).join('')}</select>
 <select onchange="S.f.time=this.value;list()" aria-label="Time required"><option value="">Any time</option><option value="s" ${S.f.time==='s'?'selected':''}>Under 5 hours</option><option value="m" ${S.f.time==='m'?'selected':''}>5 to 20 hours</option><option value="l" ${S.f.time==='l'?'selected':''}>Over 20 hours</option></select>
 <input placeholder="Location" value="${esc(S.f.loc)}" oninput="S.f.loc=this.value;list()" aria-label="Location"></div><div class="grid" id="list">${cards()}</div>`}
function list(){$('list').innerHTML=cards()}
function charityMark(charity){const initials=charity.name.split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase();return {label:charity.logo||initials,color:charity.brandColor||'#5b3df5'}}
function openCharity(id){const charity=ch(id);if(!charity)return;const mark=charityMark(charity),projects=S.projects.filter(p=>p.charityId===id),facts=[['Focus areas',charity.focus],['Who they support',charity.serves],['Ways to get involved',charity.waysToHelp]].filter(([,value])=>value);
 $('dlg').innerHTML=`<div style="display:flex;align-items:center;gap:14px"><span class="charity-mark" style="--brand:${esc(mark.color)};width:58px;height:58px">${esc(mark.label)}</span><div><div class="mut">Charity profile · ${esc(charity.loc||'Location not provided')}</div><h2>${esc(charity.name)}</h2></div></div><p>${esc(charity.about||'This charity has not added a profile description yet.')}</p>${facts.length?`<div class="panel">${facts.map(([label,value])=>`<p><b>${esc(label)}:</b> ${esc(value)}</p>`).join('')}</div>`:''}${charity.website?`<p><a href="${esc(charity.website)}" target="_blank" rel="noopener noreferrer">Visit ${esc(charity.name)}’s official website</a></p>`:''}${charity.demoOnly?'<p class="err">The project shown here is a fictional demo brief, not an official Oxfam opportunity. Check Oxfam’s website for real opportunities.</p>':''}<h3>Projects (${projects.length})</h3>${projects.length?projects.map(p=>`<div class="charity-project"><b>${esc(p.title)}</b><div class="mut">${esc(p.sector)} · Skills: ${esc(p.skills)} · ${esc(p.hours)} hours · ${esc(p.loc)}</div><p>${esc(p.what)}</p><span class="tag ${p.status==='live'?'g':'y'}">${p.status==='live'?'Open':'In progress'}</span></div>`).join(''):'<p class="mut">No projects posted yet.</p>'}<p><button class="b alt" onclick="$('dlg').close()">Close</button></p>`;$('dlg').showModal()}
function cards(){const f=S.f,u=me(),stu=u.role==='student';
 const a=S.projects.filter(p=>vis(p)&&(!f.sector||p.sector===f.sector)&&(!f.loc||p.loc.toLowerCase().includes(f.loc.toLowerCase()))&&
 (!f.time||(f.time==='s'?p.hours<5:f.time==='m'?p.hours>=5&&p.hours<=20:p.hours>20))&&
 (!f.q||(p.title+p.what+p.skills+p.sector).toLowerCase().includes(f.q.toLowerCase())));
 return a.length?a.map(p=>{const done=S.apps.some(x=>x.projectId===p.id&&x.userId===u.id),charity=ch(p.charityId),mark=charityMark(charity);return `<article class="proj"><button class="charity-link" onclick="openCharity(${charity.id})" aria-label="View ${esc(charity.name)} charity profile"><span class="charity-mark" style="--brand:${esc(mark.color)}">${esc(mark.label)}</span><span><strong>${esc(charity.name)}</strong><small>View charity profile and projects</small></span></button><h3>${esc(p.title)}</h3><div><span class="tag y">${TYPES[p.type]}</span><span class="tag">${p.sector}</span><span class="tag">${esc(p.loc)}</span><span class="tag">~${p.hours} hrs</span></div>
 <div>${esc(p.what)}</div><div class="mut"><b>Why it matters:</b> ${esc(p.why)}</div><div class="mut">Skills: ${esc(p.skills)} · Deadline ${esc(p.deadline)} · Budget ${esc(p.budget)}</div>
 ${p.employeeId?`<div class="mut">Mentor company: ${esc(co(ch(p.employeeId)).name)}</div>`:''}
 <button class="b sm" ${done?'disabled':''} onclick="apply(${p.id})">${done?'Already sent':stu?(p.employeeId?'Apply to mentor':'Offer to help'):'Offer to help'}</button></article>`}).join(''):`<div class="panel">No projects match yet. Clear a filter or check back soon.</div>`}
function apply(id){const p=pr(id),u=me();
 if(u.role==='student'&&!u.cv){toast('Add your CV on your profile before applying.');return go('profile')}
 $('dlg').innerHTML=`<h3>${esc(p.title)}</h3><p class="mut">${u.role==='student'&&p.employeeId?'Your offer goes straight to the mentor company, which decides who joins.':'Your offer goes to the charity.'}</p><p class="mut"><b>They ask for:</b> ${esc(p.ask||'a short note')}</p>
 <label for="am">Why you, and how can you help?</label><textarea id="am"></textarea><label for="ax">Requested item</label><input id="ax">${u.role==='student'?`<p class="mut">CV attached: ${esc(u.cv)}</p>`:''}
 <p><button class="b" onclick="sendApp(${id})">Send offer</button> <button class="b alt" onclick="$('dlg').close()">Cancel</button></p>`;$('dlg').showModal()}
function sendApp(id){const u=me();if(!$('am').value.trim())return toast('Add a short message first.');
 S.apps.push({id:nid(),projectId:id,userId:u.id,msg:$('am').value,extra:$('ax').value,cv:u.cv,status:'sent'});$('dlg').close();toast('Offer sent');render()}
function mine(){const u=me();
 if(u.role==='charity'){const a=S.projects.filter(p=>p.charityId===u.id);return `<h2>My projects</h2>${!u.approved?'':''}${a.length?`<div class="grid">${a.map(p=>`<div class="proj"><h3>${esc(p.title)}</h3><div><span class="tag ${p.status==='live'?'g':'y'}">${p.status==='live'?'Published':'In platform review'}</span><span class="tag">${TYPES[p.type]}</span></div><div class="mut">${p.type!=='none'?(p.employeeId?'Matched with '+esc(co(ch(p.employeeId)).name):'Waiting for a company employee'):'Open to students directly'}</div><div class="mut">${S.apps.filter(x=>x.projectId===p.id).length} offer(s)</div></div>`).join('')}</div>`:'<div class="panel">No projects yet. Submit your first one.</div>'}`}
 const a=S.apps.filter(x=>x.userId===u.id);
 return `<h2>${u.role==='student'?'My applications':'My offers'}</h2>${a.length?a.map(x=>{const p=pr(x.projectId);return `<div class="panel"><h3>${esc(p.title)}</h3><span class="tag ${x.status==='accepted'?'g':x.status==='declined'?'r':'y'}">${x.status==='sent'?'Waiting for a decision':x.status==='accepted'?'Chosen!':'Not selected'}</span><p class="mut">${p.employeeId&&u.role==='student'?'Decided by '+esc(co(ch(p.employeeId)).name):'Decided by '+esc(ch(p.charityId).name)}</p></div>`}).join(''):'<div class="panel">Nothing yet. Browse opportunities and send your first offer.</div>'}`}
function post(){const u=me();if(!u.approved)return `<div class="panel">Your charity is awaiting verification.</div>`;
 return `<h2>Submit a project</h2><div class="panel"><label for="t">Project title</label><input id="t"><label for="w">What needs building?</label><textarea id="w"></textarea><label for="y">Why does it matter?</label><textarea id="y"></textarea><label for="s">Skills required</label><input id="s">
 <div class="row"><div><label for="tl">Expected timeline</label><input id="tl" placeholder="e.g. 6 weeks"></div><div><label for="dl">Deadline</label><input id="dl" type="date"></div><div><label for="hr">Hours needed</label><input id="hr" type="number" min="1" value="10"></div><div><label for="bd">Budget</label><input id="bd" placeholder="£0 / £500"></div>
 <div><label for="sc">Sector</label><select id="sc">${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></div><div><label for="ty">Mentoring or shadowing</label><select id="ty">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${k==='none'?'None (volunteering only)':v}</option>`).join('')}</select></div></div>
 <label for="ak">What should applicants send? (CV, portfolio…)</label><input id="ak"><p class="mut">The platform team checks every project is genuine and the budget is reasonable. Projects with a company element are shown to company employees first.</p><div id="err"></div><button class="b" onclick="submitProj()">Send for review</button></div>`}
function submitProj(){const g=i=>$(i).value.trim();if(!g('t')||!g('w')||!g('y')||!g('s')||!g('dl'))return err('Fill in title, what, why, skills and deadline.');
 S.projects.push({id:nid(),charityId:me().id,title:g('t'),what:g('w'),why:g('y'),skills:g('s'),timeline:g('tl'),deadline:g('dl'),budget:g('bd')||'None',type:g('ty'),sector:g('sc'),loc:me().loc||'',hours:+g('hr')||1,ask:g('ak'),status:'pending',employeeId:null});toast('Project sent for platform review');go('mine')}
function decide(){const u=me();let out='';
 const rows=S.apps.filter(x=>{const p=pr(x.projectId);if(u.role==='charity')return p.charityId===u.id&&(ch(x.userId).role==='employee'||!p.employeeId);return p.employeeId===u.id&&ch(x.userId).role==='student'});
 out=rows.length?rows.map(x=>{const a=ch(x.userId),p=pr(x.projectId);return `<div class="panel"><h3>${esc(a.name)} <span class="tag">${a.role==='employee'?'Employee at '+esc(co(a).name):esc(a.year)}</span></h3><p class="mut">For: ${esc(p.title)}${a.role==='student'?' · '+esc(a.loc)+' · CV: '+esc(x.cv):''}</p><p>${esc(x.msg)}</p>${x.extra?'<p class="mut">Attached: '+esc(x.extra)+'</p>':''}
 ${x.status==='sent'?`<button class="b sm" onclick="pick(${x.id},'accepted')">${a.role==='employee'?'Match with this company':'Choose'}</button> <button class="b sm no" onclick="pick(${x.id},'declined')">Decline</button>`:`<span class="tag ${x.status==='accepted'?'g':'r'}">${x.status}</span>`}</div>`}).join(''):'<div class="panel">No offers to review yet.</div>';
 return `<h2>${u.role==='charity'?'Offers received':'Student applications'}</h2>${out}`}
function pick(id,s){const x=S.apps.find(a=>a.id===id),p=pr(x.projectId);x.status=s;if(s==='accepted'&&ch(x.userId).role==='employee'){p.employeeId=x.userId;toast('Matched! The project is now visible to students.')}else toast(s==='accepted'?'Student chosen':'Declined');render()}
function team(){const c=co(me()),t=S.users.filter(u=>u.role==='employee'&&u.companyId===c.id);
 return `<h2>${esc(c.name)} employees</h2><p class="mut">Approve colleagues here. The platform team then verifies each account.</p>${c.verified?'':'<div class="err">Your company is not verified yet. Employees cannot join until it is.</div>'}${t.map(e=>`<div class="item"><span>${esc(e.name)} · ${esc(e.email)}</span>${e.leadOk?'<span class="tag g">Approved by you</span>':`<button class="b sm" onclick="ch(${e.id}).leadOk=true;render()">Approve</button>`} ${e.approved?'<span class="tag g">Verified</span>':'<span class="tag y">Platform check pending</span>'}</div>`).join('')||'<div class="panel">No employees yet.</div>'}`}
function admin(){const q=[...S.companies.filter(c=>!c.verified).map(c=>['Company',c.name+' ('+c.domain+')',()=>`S.companies.find(c=>c.id==${c.id}).verified=true`]),
 ...S.users.filter(u=>!u.approved&&u.role==='charity').map(u=>['Charity',u.name+' · reg. no. '+u.charityNo+' (check Charity Commission register)',()=>`ch(${u.id}).approved=true`]),
 ...S.users.filter(u=>!u.approved&&u.role==='employee').map(u=>['Employee',u.name+' at '+co(u).name+(u.leadOk?'':' (company lead has not approved yet)'),()=>`ch(${u.id}).approved=true`]),
 ...S.projects.filter(p=>p.status==='pending').map(p=>['Project',p.title+' · budget '+p.budget+' · '+TYPES[p.type],()=>`pr(${p.id}).status='live'`])];
 return `<h2>Review queue</h2>${q.length?q.map(([k,t,f])=>`<div class="item"><span><span class="tag y">${k}</span>${esc(t)}</span><button class="b sm" onclick="${f()};toast('Approved');render()">Approve</button></div>`).join(''):'<div class="panel">Everything is reviewed.</div>'}`}
render();
</script>
<script>
// ---- Database-backed overrides: these replace the demo functions above ----
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
async function load(){try{const d=await api('state');Object.assign(S,{charities:[],user:d.me,users:d.users,projects:d.projects,apps:d.apps,companies:d.companies})}catch(e){S.user=null}render()}
async function act(fn,ok){try{await fn();if(ok)toast(ok);await load()}catch(e){toast(e.message)}}
const MSG={student:'Verified! You can log in now.',charity:'Email verified. The platform team will now check your Charity Commission number.',company:'Email verified. The platform team will now verify your company.',employee:'Email verified. Your company lead must approve you, then the platform verifies you.'};
async function login(){try{await api('login',{email:$('e').value,password:$('p').value,role:S.role});S.view='home';await load()}catch(e){err(e.message)}}
async function logout(){await api('logout',{}).catch(()=>{});S.view='home';await load()}
async function signup(){const v=i=>$(i)?$(i).value:'';try{const d=await api('signup',{role:S.role,name:v('n'),email:v('e'),password:v('p'),year:v('y'),charityNo:v('cn'),loc:v('l'),values:v('v'),mode:v('k'),companyId:v('cc'),company:{name:v('cn2'),loc:v('cl'),sector:v('cs'),desc:v('cd')}});S.pend={email:v('e').trim().toLowerCase(),role:d.role};go('verify');toast('Demo inbox: your verification code is '+d.code,15000)}catch(e){err(e.message)}}
async function confirmCode(){try{const d=await api('verify',{email:S.pend.email,code:$('c').value});S.pend=null;S.role=d.role==='employee'?'company':d.role;S.mode='in';go('auth');toast(MSG[d.role],7000)}catch(e){err(e.message)}}
function saveProf(){const f=$('cv').files[0];act(()=>api('profile',{name:$('pn').value,loc:$('pl').value,values:$('pv').value,interests:$('pi').value,projects:$('pp').value,cv:f?f.name:undefined}),'Profile saved')}
function saveLoc(){act(()=>api('profile',{loc:$('pl').value}),'Profile saved')}
function sendApp(id){if(!$('am').value.trim())return toast('Add a short message first.');act(async()=>{await api('applications',{projectId:id,msg:$('am').value,extra:$('ax').value});$('dlg').close()},'Offer sent')}
async function submitProj(){const g=i=>$(i).value.trim();if(!g('t')||!g('w')||!g('y')||!g('s')||!g('dl'))return err('Fill in title, what, why, skills and deadline.');
 try{await api('projects',{title:g('t'),what:g('w'),why:g('y'),skills:g('s'),timeline:g('tl'),deadline:g('dl'),budget:g('bd'),type:g('ty'),sector:g('sc'),hours:+g('hr'),ask:g('ak')});toast('Project sent for platform review');S.view='mine';await load()}catch(e){err(e.message)}}
function pick(id,s){act(()=>api('decide',{id,status:s}),s==='accepted'?'Chosen!':'Declined')}
function admin(){const q=[...S.companies.filter(c=>!c.verified).map(c=>['Company',c.name+' ('+c.domain+')','company',c.id]),
 ...S.users.filter(u=>!u.approved&&u.role==='charity').map(u=>['Charity',u.name+' · reg. no. '+u.charityNo+' (check Charity Commission register)','user',u.id]),
 ...S.users.filter(u=>!u.approved&&u.role==='employee').map(u=>['Employee',u.name+' at '+co(u).name+(u.leadOk?'':' (company lead has not approved yet)'),'user',u.id]),
 ...S.projects.filter(p=>p.status==='pending').map(p=>['Project',p.title+' · budget '+p.budget+' · '+TYPES[p.type],'project',p.id])];
 return `<h2>Review queue</h2>`+(q.length?q.map(([k,t,kind,id])=>`<div class="item"><span><span class="tag y">${k}</span>${esc(t)}</span><button class="b sm" onclick="act(()=>api('approve',{kind:'${kind}',id:${id}}),'Approved')">Approve</button></div>`).join(''):'<div class="panel">Everything is reviewed.</div>')}
S.users=[];S.charities=[];S.projects=[];S.apps=[];S.companies=[];
load();
</script>

 student1:{email:'amara@kcl.ac.uk',role:'student'},

// ---- CV matcher (Node -> Python/Gemini scanner) ----
function scanPanel(){return `<div class="panel"><h3>Match me to projects</h3><p class="mut">Upload your CV (PDF) and we will rank the open projects that suit your skills and experience. The CV is sent to Google Gemini for this check and is not saved.</p><input id="scv" type="file" accept=".pdf,application/pdf" aria-label="CV file"><p><button class="b sm" onclick="runScan()">Find my matches</button></p><div id="scanOut"></div></div>`}
const _browse=browse;browse=function(){return (me().role==='student'?scanPanel():'')+_browse()};
async function runScan(){const f=$('scv').files[0],o=$('scanOut');if(!f)return toast('Choose your CV first.');o.innerHTML='<p class="mut">Reading your CV…</p>';
 try{const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':f.type||'application/pdf'},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||'Scan failed');
  o.innerHTML=`<p>${esc(d.candidate_summary)}</p>`+d.shortlist.map(m=>{const p=pr(+m.project_id);return `<div class="proj"><h3>${esc(m.project_title)} <span class="tag g">${esc(m.match_score)}% match</span></h3><div>${(m.skill_alignment||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div><p class="mut">${esc(m.summary_reason)}</p>${p?`<button class="b sm" onclick="apply(${p.id})">Offer to help</button>`:''}</div>`}).join('')}
 catch(e){o.innerHTML=`<div class="err" role="alert">${esc(e.message)}</div>`}}
</script>
